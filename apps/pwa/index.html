<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14532d" />
    <meta name="description" content="Företag och arbetsställen nära en adress, ur svenska öppna myndighetsdata." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Öppna företagsdata</title>
  </head>
  <body>
    <header class="bar">
      <div class="brand"><img src="/icon.svg" alt="" width="28" height="28" /><span>Öppna företagsdata</span></div>
      <form id="search" class="search" role="search">
        <label class="sr" for="q">Adress</label>
        <input id="q" name="q" autocomplete="street-address" placeholder="Adress, t.ex. Kaffegatan 1, 411 60 Göteborg" required />
        <label class="sr" for="radius">Radie</label>
        <select id="radius" name="radius">
          <option value="250">250 m</option>
          <option value="500" selected>500 m</option>
          <option value="1000">1 km</option>
          <option value="2500">2,5 km</option>
          <option value="5000">5 km</option>
        </select>
        <label class="sr" for="sni">SNI</label>
        <input id="sni" name="sni" inputmode="numeric" pattern="\d{1,5}" placeholder="SNI (valfritt)" size="9" />
        <button type="submit">Sök</button>
      </form>
    </header>
    <main class="layout">
      <section id="map" aria-label="Karta"></section>
      <aside class="panel" aria-live="polite">
        <div id="status" class="status">Sök på en adress för att se juridiska personers arbetsställen i närheten.</div>
        <div id="area"></div>
        <ol id="results" class="results"></ol>
        <button id="more" class="more" hidden>Visa fler</button>
        <div id="detail"></div>
        <details class="watch">
          <summary>Bevaka området</summary>
          <form id="watch">
            <p>Få e-post när nya arbetsställen registreras i kommunen. Du bekräftar först via e-post.</p>
            <label>E-post <input name="email" type="email" required autocomplete="email" /></label>
            <label>Kommunkod <input name="kommun" pattern="\d{4}" required size="5" /></label>
            <label>SNI-prefix <input name="sniPrefix" pattern="\d{1,5}" size="6" /></label>
            <button type="submit">Bevaka</button>
            <p id="watch-status" class="status"></p>
          </form>
        </details>
        <footer class="sources">
          <p>Fysiska personer (enskilda firmor, dödsbon) visas aldrig. Respektera reklamspärr.</p>
          <p id="attribution"></p>
        </footer>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
