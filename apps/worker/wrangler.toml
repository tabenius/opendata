name = "opendata"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# The PWA (apps/pwa, `pnpm --filter @opendata/pwa build`). Paths without a
# matching file fall through to the Worker (GraphQL, MCP, files, watches).
[assets]
directory = "../pwa/dist"

# Files, snapshots, annual reports. `wrangler r2 bucket create opendata`
[[r2_buckets]]
binding = "OBJECTS"
bucket_name = "opendata"

# `wrangler d1 create opendata`, then put the id here.
[[d1_databases]]
binding = "DB"
database_name = "opendata"
database_id = "00000000-0000-0000-0000-000000000000"

# `wrangler kv namespace create CACHE`, then put the id here.
[[kv_namespaces]]
binding = "CACHE"
id = "00000000000000000000000000000000"

[vars]
PUBLIC_URL = "https://opendata.example.workers.dev"
MAIL_FROM = ""
RATE_LIMIT_PER_MINUTE = "120"
# Snapshot label the cron imports into D1 (published by the Linux ingest job).
SNAPSHOT_LABEL = "local"

# Optional: Email Routing send_email binding (delivers to verified destination
# addresses only). Set RESEND_API_KEY instead for arbitrary recipients.
# [[send_email]]
# name = "EMAIL"

[triggers]
# Snapshot import check and outbox delivery.
crons = ["*/15 * * * *"]

# Secrets (wrangler secret put NAME): ADMIN_TOKEN, MCP_TOKEN (optional), RESEND_API_KEY,
# RBQ_REPOSITORIES (JSON: {"<uuid>": {"token": "rbm_...", "prefix": "repositories/<uuid>/", "quotaBytes": 1073741824}}).
