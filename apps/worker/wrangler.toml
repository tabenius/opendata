name = "opendata"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Files, snapshots, annual reports. `wrangler r2 bucket create opendata`
[[r2_buckets]]
binding = "OBJECTS"
bucket_name = "opendata"

# `wrangler d1 create opendata`, then put the id here.
[[d1_databases]]
binding = "DB"
database_name = "opendata"
database_id = "00000000-0000-0000-0000-000000000000"

# `wrangler kv namespace create CACHE`, then put the id here.
[[kv_namespaces]]
binding = "CACHE"
id = "00000000000000000000000000000000"

[vars]
PUBLIC_URL = "https://opendata.example.workers.dev"
MAIL_FROM = ""
RATE_LIMIT_PER_MINUTE = "120"
# Snapshot label the cron imports into D1 (published by the Linux ingest job).
SNAPSHOT_LABEL = "local"

[triggers]
# Snapshot import check and outbox delivery.
crons = ["*/15 * * * *"]

# Secrets (wrangler secret put NAME): ADMIN_TOKEN, RESEND_API_KEY,
# RBQ_REPOSITORIES (JSON: {"<uuid>": {"token": "rbm_...", "prefix": ""}}).
